# ==============================================================================
# GITHUB ACTIONS — Pipeline de CI/CD
# ==============================================================================
# Este archivo se llama WORKFLOW. GitHub Actions lo lee automáticamente y lo
# ejecuta en un servidor (runner) en la nube cada vez que ocurre el trigger.
#
# Flujo (CI/CD):
#   1. CI (Continuous Integration): TEST — corre la suite en cada push/PR.
#   2. CD (Continuous Delivery)    : BUILD + PUSH — si los tests pasan y el push
#      es a la rama de la demo (`gitops`), construye la imagen y la publica en
#      GHCR (artefacto listo) con un tag ÚNICO = el SHA del commit.
#   3. DEPLOY = GITOPS (automático): el mismo pipeline actualiza el archivo
#      `kubernetes.yaml` en Git con esa imagen nueva, y **ArgoCD** (que vigila
#      ese mismo repo) detecta el cambio en Git y despliega solo en el clúster.
#
# Por qué GitOS, y no "deploy a mano":
#   - GitHub NO puede conectarse a una VM privada local sin IP pública.
#   - Por eso el pipeline publica la imagen en GHCR (puente) y ademas escribe
#     en el propio repo el manifiesto actualizado.
#   - ArgoCD vigila Git (la "única fuente de verdad"). Cuando ve el commit con
#     la imagen nueva, auto-sincroniza el clúster. A eso se le llama GITOPS.
#
# Estructura:
#   - name  : nombre visible del workflow (en la pestaña "Actions").
#   - on    : eventos que disparan el pipeline (push/PR a la rama gitops).
#   - jobs  : lista de trabajos (tareas). Pueden correr en paralelo o en secuencia.
#   - steps : pasos concretos dentro de cada job (checkout, test, build, push).
# ==============================================================================

name: CI/CD

# ------------------------------------------------------------------------------
# "on" — DISPARADORES (cuándo se ejecuta el pipeline)
# ------------------------------------------------------------------------------
on:
  # Se activa cuando hay un push a la rama de la demo ("gitops").
  # (En clase: cambiamos la rama para no ensuciar `main`; puedes volver a
  #  poner `[main]` cuando quieras el flujo estandar.)
  push:
    branches: [gitops]

# ------------------------------------------------------------------------------
# JOB: "test" — INTEGRACIÓN CONTINUA (siempre)
# ------------------------------------------------------------------------------
jobs:
  test:
    # runs-on: tipo de máquina (runner) donde corre este job.
    # ubuntu-latest = máquina Linux efímera provisionada por GitHub.
    runs-on: ubuntu-latest

    # services: levanta contenedores "de apoyo" para el job.
    # Aquí levantamos un MongoDB TEMPORAL para los tests de integración,
    # así los tests no dependen de tu Mongo local. Es como un docker compose
    # efímero para la prueba.
    services:
      mongo:
        image: mongo:7
        # Exponemos el 27017 del contenedor Mongo al runner local.
        ports:
          - 27017:27017

    # env: variables de entorno para este job.
    # MONGO_URI_TEST apunta al Mongo del servicio (localhost en el runner).
    # Sin esto, los tests de integración NO sabrían a qué BD conectarse.
    env:
      MONGO_URI_TEST: mongodb://localhost:27017/login_test
      JWT_SECRET: test-secret

    steps:
      # actions/checkout@v4: descarga el código del repositorio al runner.
      # Sin este paso no hay código sobre el cual trabajar.
      - uses: actions/checkout@v4

      # actions/setup-node@v4: instala/usa una versión específica de Node.
      # cache: npm habilita el caché de node_modules → builds más rápidos.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala dependencias EXACTAS desde package-lock.json (reproducible).
      - name: Instalar dependencias
        run: npm ci

      # Corremos los tests unitarios (puros, sin BD).
      - name: Tests unitarios
        run: npm run test:unit

      # Corremos los tests de integración contra el Mongo del servicio.
      # Si aquí fallan, el job falla, el pipeline se detiene y NO se publica nada.
      - name: Tests de integración
        run: npm run test:integration

  # ------------------------------------------------------------------------------
  # JOB: "build-and-push" — ENTREGA CONTINUA + GITOPS
  # (solo en la rama gitops y tras pasar los tests)
  # ------------------------------------------------------------------------------
  build-and-push:
    # needs: test : este job NO arranca hasta que el job "test" terminó OK.
    # Si el job "test" falla, esto NUNCA se ejecuta. Es la "puerta" del CI.
    needs: test
    # if: condición extra. Solo se ejecuta si el push fue a la rama `gitops`
    # y SI NO fue el propio bot (evita el bucle infinito del commit [skip ci]).
    if: github.ref == 'refs/heads/gitops' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    # permissions: permisos que le damos al token automático de GitHub.
    #   contents: write  -> poder LEER el código Y hacer commit/push del manifest.
    #   packages: write  -> poder publicar (push) en GHCR.
    # El token ${{ secrets.GITHUB_TOKEN }} se genera automáticamente por GitHub.
    permissions:
      contents: write
      packages: write

    steps:
      # Descargamos el código (igual que en test).
      - uses: actions/checkout@v4

      # setup-buildx-action: prepara BuildKit (motor de builds moderno de Docker)
      # que permite construir imágenes multiplataforma. Lo usamos para hacer build.
      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      # login-action: nos autenticamos contra el Registro de Contenedores de
      # GitHub (GHCR, registry ghcr.io) para poder hacer push de la imagen.
      #   - username: github.actor -> el usuario que disparó el workflow.
      #   - password: GITHUB_TOKEN -> token automático (no hace falta uno manual).
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-push-action: construye la imagen DESDE nuestro Dockerfile y la
      # SUBE (push: true) a GHCR.
      #   context: . -> el contexto de build es la carpeta actual del repo.
      #   tags: ghcr.io/<owner>/devops-app:<SHA> -> tag ÚNICO por commit.
      # El tag con SHA es CLAVE para GitOps: cada push produce una imagen
      # distinta y además un cambio en Git (ArgoCD se entera).
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nirbeat/devops-app:${{ github.sha }}
            ghcr.io/nirbeat/devops-app:latest

      # COMPROMISO GITOPS: actualizamos la imagen en kubernetes.yaml y
      # commiteamos el cambio EN Git. Este es el corazón del flujo:
      # "Git siempre dice cuál es la versión verdadera".
      - name: Actualizar kubernetes.yaml con la imagen nueva
        run: |
          sed -i "s#image: ghcr.io/nirbeat/devops-app:.*#image: ghcr.io/nirbeat/devops-app:${{ github.sha }}#g" kubernetes.yaml

      # Volvemos a dejar el repo con el manifiesto al día. El mensaje lleva
      # "[skip ci]" para que GitHub NO relance este workflow (anti-bucle).
      - name: Commit y push del manifest actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes.yaml
          git commit -m "chore: desplegar imagen ghcr.io/nirbeat/devops-app:${{ github.sha }} [skip ci]" || echo "sin cambios"
          git push origin HEAD:gitops

# ------------------------------------------------------------------------------
# NOTA DE CLASE — CÓMO CIERRA EL CICLO CON ARGOCD (GITOPS)
# ------------------------------------------------------------------------------
# 1. Haces push a `gitops`.
# 2. GitHub corre: test -> build+push (GHCR con tag <SHA>) -> commit del manifest.
# 3. ArgoCD (vivde instalado DENTRO de la VM, via bootstrap) vigila este repo,
#    rama `gitops`. Ve el commit nuevo en kubernetes.yaml.
# 4. ArgoCD auto-sincroniza (autoSync + selfHeal + prune): aplica la nueva
#    imagen y el Deployment de Kubernetes hace roll-out. Tú NO tocas nada.
# 5. Resultado en la VM: http://<ip-de-la-vm>:30000 queda actualizada sola.
# ==============================================================================

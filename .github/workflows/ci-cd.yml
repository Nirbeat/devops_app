# # ==============================================================================
# # NOTA DE CLASE — DEPLOY MANUAL a tu VM local
# # ==============================================================================
# # Después de que "build-and-push" publica ghcr.io/<usuario>/login-app:latest,
# # en tu VM local ejecutas a mano:
# #
# #   echo $TOKEN | docker login ghcr.io -u <usuario> --password-stdin
# #   docker compose pull     # descarga la última imagen publicada
# #   docker compose up -d    # levanta app + mongo
# #
# # Por qué manual: GitHub Actions (runner en la nube) NO puede conectarse a una
# # VM privada local sin IP pública/túnel o un self-hosted runner. El registro
# # GHCR actúa como "puente": GitHub produce el artefacto, tú lo despliegas.
# # ==============================================================================
